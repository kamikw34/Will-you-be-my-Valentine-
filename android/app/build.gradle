plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sekretik.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sekretik.game'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Игра лежит в папке game/ в корне репозитория и попадает в APK как есть
    sourceSets {
        main {
            assets.srcDirs = ['../../game']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
